name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The templates' DevkitVersion must follow a release that changed the
  # built-in skills (devkit update and pull compare with it to tell an older
  # binary to self-update). The release is published either way; this job
  # goes red, and stays red in the registry's daily check, until the
  # templates follow.
  team-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: devkit
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: sezznaw/devkit-registry
          path: devkit-registry
      - run: python3 devkit-registry/scripts/check.py
